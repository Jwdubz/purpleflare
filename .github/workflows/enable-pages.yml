name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main with custom domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if ! gh api "repos/${REPO}/pages" >/tmp/pages.json 2>/tmp/pages.err; then
            echo "Pages not configured yet; creating from main /"
            gh api --method POST "repos/${REPO}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f build_type=legacy \
              -F source[branch]=main \
              -F source[path]=/ | tee /tmp/pages.json
          else
            echo "Pages already exists"
            cat /tmp/pages.json
          fi
          echo "Updating CNAME and HTTPS enforcement"
          # Do not enforce HTTPS while the custom-domain cert is pending.
          gh api --method PUT "repos/${REPO}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f cname='purpleflare.jarrettwroten.com' \
            -F https_enforced=false \
            -f build_type=legacy \
            -F source[branch]=main \
            -F source[path]=/ | tee /tmp/pages-updated.json
          echo "Pages configuration:"
          gh api "repos/${REPO}/pages"
